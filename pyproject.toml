[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="sfo-path-planning-benchmark"
version="1.3.2"
description="Reproducible SFO path-planning benchmark"
readme="README.md"
requires-python=">=3.11,<3.13"
license={text="MIT"}
dependencies=["numpy==1.26.0","PyYAML>=6.0","matplotlib>=3.8","pillow>=10.0","scipy>=1.11","pandas>=2.0","openpyxl>=3.1"]

[project.optional-dependencies]
dev=["pytest>=8.0","pytest-cov>=5.0","ruff>=0.5","mypy>=1.10"]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
