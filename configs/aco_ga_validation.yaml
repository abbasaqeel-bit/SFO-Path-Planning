experiment:
  name: aco_ga_validation
  runs: 3
  base_seed: 20260727
  output_directory: results/verification/aco_ga_maps
  save_plots: true

environments:
  maps_file: configs/maps.yaml
  map_ids:
    - open_01
    - simple_01
    - mixed_01
    - dense_01
    - narrow_passage_01
    - bug_trap_01

planners:
  - name: aco_ga_paper_reproduction
    family: hybrid_population_optimization
    adapter: aco_ga_matlab
    parameters:
      runtime: auto
      resolution: 1.0
      population_size: 80
      aco_iterations: 90
      ga_iterations: 60
      rho: 0.25
      alpha: 2.0
      beta: 8.0
      Q: 100.0
      Pc: 0.2
      Pm: 0.05
      length_weight: 0.5
      smoothness_weight: 0.5
      allow_corner_cutting: false
      timeout_seconds: 1800
